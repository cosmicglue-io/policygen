name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:policygen
      - name: Verify the release schema is committed
        run: |
          SCHEMA_VERSION=$(node -p 'require("./packages/policygen/package.json").version.split(".").slice(0, 2).join(".")')
          SCHEMA_PATH="packages/docs/public/schemas/$SCHEMA_VERSION/schema.json"
          git ls-files --error-unmatch "$SCHEMA_PATH"
          git diff --exit-code HEAD -- "$SCHEMA_PATH"
      - run: pnpm build:docs

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: policygen-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.5.1

      - name: Check whether this version is already published
        id: version
        working-directory: packages/policygen
        run: |
          npm view policygen versions --json > "$RUNNER_TEMP/policygen-versions.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const published = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/policygen-versions.json`, 'utf8'));
          const exists = [published].flat().includes(version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${!exists}\n`);
          console.log(exists ? `policygen@${version} is already published.` : `Publishing policygen@${version}.`);
          NODE

      - if: steps.version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.changed == 'true'
        run: pnpm build:policygen
      - name: Verify the release schema is hosted
        if: steps.version.outputs.changed == 'true'
        run: |
          SCHEMA_VERSION=$(node -p 'require("./packages/policygen/package.json").version.split(".").slice(0, 2).join(".")')
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "https://policygen.xyz/schemas/$SCHEMA_VERSION/schema.json" \
            --output "$RUNNER_TEMP/policygen-hosted-schema.json"
          cmp packages/policygen/dist/config_schema.json "$RUNNER_TEMP/policygen-hosted-schema.json"
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: packages/policygen
        run: npm publish --provenance --access public
